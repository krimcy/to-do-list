<!DOCTYPE html>
<html>
<head>
    <title>To-Do List (No JS)</title>
</head>
<body>

    <h1>My To-Do List</h1>

    <!-- Add Task -->
    <form action="/add" method="POST">
        <input type="text" name="task" placeholder="Enter task" required>
        <button type="submit">Add</button>
    </form>

    <hr>
<!-- Task List -->
    <ul>
        {% for task in tasks %}
            <li>
                {{ task }}
                <a href="/delete/{{ loop.index0 }}">Delete</a>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
